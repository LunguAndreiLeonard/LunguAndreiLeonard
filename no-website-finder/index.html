<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>No-Website Finder · Prospectare</title>
  <meta name="description" content="Unealta mea de prospectare: afaceri de pe Google Maps fără website + AI." />

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,600;1,9..144,700&family=JetBrains+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <aside id="sidebar">
    <header class="brand">
      <span class="eyebrow">● Unealtă de prospectare</span>
      <h1 class="display">Afaceri <em>fără</em><br />website.</h1>
      <p class="tagline">Le găsești pe hartă, le clasează AI-ul, le contactezi. Mai puține bătăi de cap, mai mulți clienți.</p>
    </header>

    <form id="search-form">
      <label class="field">
        <span>Țară</span>
        <select id="country">
          <option value="Canada">🇨🇦 Canada</option>
          <option value="USA">🇺🇸 SUA</option>
          <option value="United Kingdom">🇬🇧 Marea Britanie</option>
          <option value="Germany">🇩🇪 Germania</option>
          <option value="Spain">🇪🇸 Spania</option>
        </select>
      </label>

      <label class="field">
        <span>Oraș</span>
        <input id="city" type="text" placeholder="ex: Toronto" autocomplete="off" />
      </label>

      <label class="field">
        <span>Ce cauți (opțional — AI)</span>
        <input id="query" type="text" placeholder="ex: frizerii și restaurante mici" />
        <span class="hint">Gol = set standard de categorii. AI-ul extinde fraza în categorii Google.</span>
      </label>

      <label class="checkbox">
        <input id="deep" type="checkbox" />
        <span>Scanare adâncă (până la 60/categorie — mai lent, costă mai mult la Google)</span>
      </label>

      <button type="submit" id="search-btn">Caută afaceri fără site</button>
      <button type="button" id="demo-btn" class="ghost">Vezi un exemplu</button>
    </form>

    <div id="status" class="status"></div>

    <div class="results-head">
      <h2>Rezultate <span id="count" class="count">0</span></h2>
      <div class="head-actions">
        <button type="button" id="score-btn" class="ghost small" disabled>⭐ Scor AI</button>
        <button type="button" id="export-btn" class="ghost small" disabled>⬇ CSV</button>
      </div>
    </div>

    <div class="filters">
      <label class="field inline">
        <span>Arată</span>
        <select id="status-filter">
          <option value="all">Toate</option>
          <option value="Nou">🆕 Noi</option>
          <option value="Contactat">📨 Contactate</option>
          <option value="Interesat">🔥 Interesate</option>
          <option value="Client">✅ Clienți</option>
          <option value="Nu">🚫 Nu</option>
        </select>
      </label>
    </div>

    <ul id="results" class="results"></ul>

    <footer class="foot">
      Hartă: OpenStreetMap · Date: Google Places (server) · AI: Claude
    </footer>
  </aside>

  <main id="map"></main>

  <!-- Modal mesaj outreach -->
  <div id="modal" class="modal hidden">
    <div class="modal-card">
      <div class="modal-head">
        <strong id="modal-title">Mesaj outreach</strong>
        <button type="button" id="modal-close" class="ghost small">✕</button>
      </div>
      <textarea id="modal-text" rows="9" readonly></textarea>
      <div class="modal-actions">
        <button type="button" id="modal-copy" class="ghost small">📋 Copiază</button>
      </div>
    </div>
  </div>

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>
  <script src="data.demo.js"></script>
  <script src="app.js"></script>
</body>
</html>
